name: Apply worker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: applykar-worker
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.65.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm apply:worker -- --once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOWED_EMAILS: khajamujahiddin@gmail.com
          APPLY_SUBMIT: "1"
          APPLY_CONCURRENCY: "2"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apply-proofs
          path: data/proofs
          if-no-files-found: ignore
          retention-days: 7
